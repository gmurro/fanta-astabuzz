[project]
name = "astabuzz"
version = "0.0.1"
description = "A digital FantaBuzzer button, for the friend who can't be at the table or for everyone in the room who doesn't have one."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Murro", email = "g.murro23@gmail.com" }
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "pydantic-settings==2.14.2",
    "pyobjc-framework-ApplicationServices>=11.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=11.0 ; sys_platform == 'darwin'",
    "rich==15.0.0",
    "typer==0.27.1",
]

[project.scripts]
astabuzz = "astabuzz.cli:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
development = [
    "commitizen>=4.15",
    "pre-commit>=4.6",
    "ruff>=0.16",
]
testing = [
    "pytest>=9.1",
]

[tool.uv]
default-groups = ["development", "testing"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",             # trailing comma — conflicts with the formatter
    "CPY001",             # copyright notice — personal project
    "D1",                 # missing docstrings — write one only when it adds something
    "E501",               # line too long — the formatter handles it
    "FIX001", "FIX002",   # FIXME/TODO markers in code
    "TC001", "TC002", "TC003",   # TYPE_CHECKING import blocks
    "TD001", "TD002", "TD003",   # TODO formatting
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Typer declares CLI flags as positional parameters with defaults, so the
# boolean-trap rules cannot be satisfied without giving up the framework.
"src/astabuzz/cli.py" = ["FBT001", "FBT002", "FBT003"]
"tests/**.py" = [
    "ANN001",  # fixture arguments do not need annotations
    "ANN201",  # return type not needed in tests
    "INP001",  # tests/ deliberately has no __init__.py
    "PLR2004", # magic value comparison — normal in assertions
    "S101",    # assert is the idiomatic way to assert in tests
    "S105", "S106",  # a literal password is the point when testing secret handling
]

[tool.commitizen]
version = "0.0.1"
version_files = [
    "pyproject.toml:^version",
    "src/astabuzz/__init__.py:__version__",
    "README.md:version-(?P<version>[^-]+)-green"
]
tag_format = "v$major.$minor.$patch$prerelease"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
bump_message = "chore(release): bump version $current_version → $new_version"
